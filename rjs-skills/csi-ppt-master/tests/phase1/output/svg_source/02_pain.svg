      <tspan x="872" dy="38">ชิ้นงานส่งลูกค้า OEM</tspan>
      <tspan x="872" dy="38">ไม่ทันรอบ</tspan></text>
    <text x="872" y="390" font-size="20" fill="#2B2F36">ตัวเลขฐานจากเอกสารโจทย์
      <tspan x="872" dy="34">• หยุดกะทันหัน 14 ครั้ง/เดือน</tspan>
