    <text x="120" y="176" font-size="24" font-weight="bold" fill="#0B2545">เครื่องหยุดโดยไม่มีสัญญาณเตือนล่วงหน้า</text>
    <text x="120" y="212" font-size="22" fill="#2B2F36">เครื่องปั๊มสาย A หยุดเฉลี่ย 14 ครั้งต่อเดือน
      <tspan x="120" dy="33">หัวหน้ากะต้องโทรตามช่างซ่อมเองทุกครั้ง</tspan></text>
  </g>
  <g id="pain-2" data-pptx-bounds="60 262 740 116">
    <circle cx="84" cy="290" r="20" fill="#0B2545" />
    <text x="84" y="297" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="120" y="298" font-size="24" font-weight="bold" fill="#0B2545">ช่างรู้ว่าเครื่องเสียช้า รอเฉลี่ย 25 นาที</text>
    <text x="120" y="334" font-size="22" fill="#2B2F36">ช่างซ่อมบำรุงรู้ก็ต่อเมื่อพนักงานหน้าเครื่องเดินมาแจ้ง
      <tspan x="120" dy="33">จึงเริ่มซ่อมได้ช้ากว่าที่ควร</tspan></text>
  </g>
  <g id="pain-3" data-pptx-bounds="60 384 740 116">
    <circle cx="84" cy="412" r="20" fill="#0B2545" />
    <text x="84" y="419" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="120" y="420" font-size="24" font-weight="bold" fill="#0B2545">ซีลไฮดรอลิกขาดสต็อก ต้องรอของ 3–5 วัน</text>
    <text x="120" y="456" font-size="22" fill="#2B2F36">อะไหล่สำคัญหมดบ่อย ต้องรอสั่งซื้อ
      <tspan x="120" dy="33">ทำให้ส่งชิ้นงานให้ลูกค้า OEM ไม่ทัน</tspan></text>
  </g>
  <g id="pain-4" data-pptx-bounds="60 506 740 116">
    <circle cx="84" cy="534" r="20" fill="#0B2545" />
    <text x="84" y="541" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="120" y="542" font-size="24" font-weight="bold" fill="#0B2545">ผู้จัดการเห็นตัวเลข OEE ย้อนหลังทุกสิ้นเดือน</text>
    <text x="120" y="578" font-size="22" fill="#2B2F36">ตัวเลขมาจาก Excel ที่พนักงานกรอกมือ
      <tspan x="120" dy="33">จึงตัดสินใจได้ช้าไปหนึ่งรอบเดือน</tspan></text>
