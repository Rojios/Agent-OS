  <g id="impact-panel" data-pptx-bounds="840 140 380 482">
    <rect x="840" y="140" width="380" height="482" fill="#F3F5F8" />
    <rect x="840" y="140" width="6" height="482" fill="#E07A1F" />
    <text x="872" y="184" font-size="17" font-weight="bold" fill="#E07A1F">ผลกระทบต่อธุรกิจ</text>
